name: Update Hashtag AMBANIMESQD

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode repositori
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Siapkan Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Jalankan pembaca TikTok
        run: node update-stats.js

      - name: Simpan dan push perubahan ke GitHub
        run: |
          git config user.name "AMBANIMESQD AutoBot"
          git config user.email "ambanimesqd@bot.com"
          git add stats.json
          git diff --staged --quiet || (git commit -m "chore: auto-update #ambanimesqd stats" && git push)