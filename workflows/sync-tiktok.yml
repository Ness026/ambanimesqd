name: Update Hashtag AMBANIMESQD

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode repositori
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Jalankan pembaca TikTok
        run: node update-stats.js

      - name: Simpan angka terbaru
        run: |
          git config --global user.name "AMBANIMESQD AutoBot"
          git config --global user.email "ambanimesqd@bot.com"
          git pull origin main --rebase || true
          git add stats.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update #ambanimesqd stats" && git push)