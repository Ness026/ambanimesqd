name: Update Hashtag AMBANIMESQD

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode repositori
        uses: actions/checkout@v4
      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Jalankan pembaca TikTok
        run: node update-stats.js
      - name: Simpan angka terbaru
        run: |
          git config user.name "AMBANIMESQD AutoBot"
          git config user.email "bot@users.noreply.github.com"
          git add stats.json
          git commit -m "chore: auto-update #ambanimesqd stats" || exit 0
          git push